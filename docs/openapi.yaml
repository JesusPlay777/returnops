      type: object
      description: Reject unknown and server-controlled fields instead of ignoring
        them.
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        asset_key:
          type: string
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9/_.-]*$
          maxLength: 160
        caption:
          type: string
          maxLength: 200
      required:
      - asset_key
      - kind
    KindEnum:
      enum:
      - PRODUCT_PHOTO
      - SERIAL_LABEL
      - RECEIPT
      type: string
      description: |-
        * `PRODUCT_PHOTO` - Product photo
        * `SERIAL_LABEL` - Serial label
        * `RECEIPT` - Receipt
    OperationsTransitionRequest:
      type: object
      description: Reject unknown and server-controlled fields instead of ignoring
