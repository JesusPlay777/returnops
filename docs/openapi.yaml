      type: object
      properties:
        expires_at:
          type: string
          format: date-time
          readOnly: true
        available_roles:
          type: array
          items:
            $ref: '#/components/schemas/AvailableRolesEnum'
          readOnly: true
        supported_locales:
          type: array
          items:
            $ref: '#/components/schemas/SupportedLocalesEnum'
          readOnly: true
        dataset_ready:
          type: boolean
          readOnly: true
      required:
      - available_roles
      - dataset_ready
      - expires_at
      - supported_locales
  securitySchemes:
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: Required with the visitor session for POST, PATCH, and DELETE.
        Read its value from the non-HttpOnly returnops_csrftoken cookie.
    visitorSession:
      type: apiKey
      in: cookie
      name: returnops_sessionid
      description: Opaque HttpOnly Django session cookie. Obtain it from GET /api/v1/session/;
        visitor UUIDs are never accepted.
tags:
- name: Demo session
  description: Bootstrap and reset the isolated visitor sandbox.
- name: Customer returns
  description: Create, edit, submit, and follow returns.
- name: Operations queue
  description: Review and transition submitted returns.
- name: Energybil demo
  description: Advance a fictional meter reading through validation, consumption,
    billing, and a simulated notification.
