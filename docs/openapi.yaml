openapi: 3.0.3
info:
  title: ReturnOps API
  version: 1.0.0
  description: Versioned API contract for the ReturnOps clean-room portfolio demo.
    All business data is fictional and isolated by browser visitor.
paths:
  /api/v1/demo/orders/:
    get:
      operationId: listEligibleDemoOrders
      description: Returns only server-owned fictional catalog data from the current
        visitor sandbox. Orders already used by a return are excluded.
      summary: List unused fictional orders eligible for return
      tags:
      - Demo orders
      security:
      - visitorSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DemoOrder'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
  /api/v1/demo/reset/:
    post:
      operationId: resetDemoDataset
      description: Atomically replaces only the current visitor's data with the canonical
        fictional scenario and refreshes its expiration.
      summary: Reset the current visitor's fictional dataset
      tags:
      - Demo session
      security:
      - visitorSession: []
        csrfToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoResetResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
  /api/v1/energybil/demo/:
    get:
      operationId: retrieveEnergybilDemo
      description: Seeds once and returns the current visitor's fictional meter-to-invoice
        workflow. No ownership identifier is accepted.
      summary: Retrieve the isolated Energybil scenario
      tags:
      - Energybil demo
      security:
      - visitorSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnergyDemo'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
  /api/v1/energybil/demo/advance/:
    post:
      operationId: advanceEnergybilDemo
      description: Advances exactly one stage in a database transaction. The final
        delivery stage is an in-app simulation; no queue or email is used.
      summary: Run the next synchronous billing stage
      tags:
      - Energybil demo
      security:
      - visitorSession: []
        csrfToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnergyDemo'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
  /api/v1/energybil/demo/reset/:
    post:
      operationId: resetEnergybilDemo
      summary: Reset only the current visitor's Energybil scenario
      tags:
      - Energybil demo
      security:
      - visitorSession: []
        csrfToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnergyDemo'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
  /api/v1/operations/returns/:
    get:
      operationId: listOperationsReturns
      summary: List non-draft returns for operational review
      parameters:
      - in: query
        name: ordering
        schema:
          enum:
          - -updated_at
          - updated_at
          - -total_value
          - total_value
          - reference
          type: string
          default: -updated_at
          minLength: 1
        description: |-
          * `-updated_at` - -updated_at
          * `updated_at` - updated_at
          * `-total_value` - -total_value
          * `total_value` - total_value
          * `reference` - reference
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 50
          minimum: 1
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 120
      - in: query
        name: status
        schema:
          enum:
          - SUBMITTED
          - NEEDS_INFORMATION
          - APPROVED
          - REJECTED
          - null
          type: string
          nullable: true
          minLength: 1
        description: |-
          * `SUBMITTED` - SUBMITTED
          * `NEEDS_INFORMATION` - NEEDS_INFORMATION
          * `APPROVED` - APPROVED
          * `REJECTED` - REJECTED
      tags:
      - Operations queue
      security:
      - visitorSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReturnRequestSummaryList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
  /api/v1/operations/returns/{id}/:
    get:
      operationId: retrieveOperationsReturn
      summary: Retrieve the expandable operations detail
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Opaque return request UUID scoped to the current visitor.
        required: true
      tags:
      - Operations queue
      security:
      - visitorSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRequestDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
  /api/v1/operations/returns/{id}/transition/:
    post:
      operationId: transitionOperationsReturn
      description: Transitions SUBMITTED to NEEDS_INFORMATION, APPROVED, or REJECTED.
        Notes are mandatory when requesting information or rejecting.
      summary: Apply an operations state transition
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Opaque return request UUID scoped to the current visitor.
        required: true
      tags:
      - Operations queue
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationsTransitionRequest'
            examples:
              RequestMoreInformation:
                value:
                  target_status: NEEDS_INFORMATION
                  note: Add a fictional serial-number image.
                summary: Request more information
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OperationsTransitionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OperationsTransitionRequest'
        required: true
      security:
      - visitorSession: []
        csrfToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRequestDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
  /api/v1/returns/:
    get:
      operationId: listCustomerReturns
      summary: List returns in the current visitor sandbox
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Customer returns
      security:
      - visitorSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReturnRequestSummaryList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
    post:
      operationId: createCustomerReturn
      summary: Create a draft from an eligible fictional order
      tags:
      - Customer returns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogReturnCreateRequest'
            examples:
              ReturnSelectedCatalogItems:
                value:
                  order_id: 3ce8a3de-d732-49bc-b1c4-1698091cf175
                  items:
                  - order_item_id: ca385771-23f5-4da7-b7c7-35c1c5b21ab0
                    quantity: 1
                    reason: DAMAGED
                    details: Fictional product damage.
                summary: Return selected catalog items
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CatalogReturnCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CatalogReturnCreateRequest'
        required: true
      security:
      - visitorSession: []
        csrfToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRequestDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
  /api/v1/returns/{id}/:
    get:
      operationId: retrieveCustomerReturn
      summary: Retrieve a return with items, evidence, and timeline
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Opaque return request UUID scoped to the current visitor.
        required: true
      tags:
      - Customer returns
      security:
      - visitorSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRequestDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
    delete:
      operationId: deleteCustomerDraft
      summary: Delete a draft return
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Opaque return request UUID scoped to the current visitor.
        required: true
      tags:
      - Customer returns
      security:
      - visitorSession: []
        csrfToken: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
  /api/v1/returns/{id}/items/{item_id}/:
    patch:
      operationId: updateCustomerReturnItem
      summary: Update an item on a mutable return
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Opaque return request UUID scoped to the current visitor.
        required: true
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        description: Opaque item UUID belonging to the selected return.
        required: true
      tags:
      - Customer returns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedReturnItemUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedReturnItemUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedReturnItemUpdateRequest'
      security:
      - visitorSession: []
        csrfToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnItem'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
    delete:
      operationId: deleteCustomerReturnItem
      summary: Delete an item from a mutable return
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Opaque return request UUID scoped to the current visitor.
        required: true
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        description: Opaque item UUID belonging to the selected return.
        required: true
      tags:
      - Customer returns
      security:
      - visitorSession: []
        csrfToken: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
  /api/v1/returns/{id}/items/{item_id}/evidence/:
    post:
      operationId: addCustomerReturnEvidence
      summary: Attach curated fictional evidence to an item
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Opaque return request UUID scoped to the current visitor.
        required: true
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        description: Opaque item UUID belonging to the selected return.
        required: true
      tags:
      - Customer returns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EvidenceWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EvidenceWriteRequest'
        required: true
      security:
      - visitorSession: []
        csrfToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
  /api/v1/returns/{id}/items/{item_id}/evidence/{evidence_id}/:
    delete:
      operationId: deleteCustomerReturnEvidence
      summary: Remove evidence from an item
      parameters:
      - in: path
        name: evidence_id
        schema:
          type: string
          format: uuid
        description: Opaque evidence UUID belonging to the selected item.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Opaque return request UUID scoped to the current visitor.
        required: true
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        description: Opaque item UUID belonging to the selected return.
        required: true
      tags:
      - Customer returns
      security:
      - visitorSession: []
        csrfToken: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
  /api/v1/returns/{id}/submit/:
    post:
      operationId: submitCustomerReturn
      description: Transitions DRAFT to SUBMITTED. For NEEDS_INFORMATION, a non-empty
        response_note is required.
      summary: Submit or resubmit a return
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Opaque return request UUID scoped to the current visitor.
        required: true
      tags:
      - Customer returns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitReturnRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmitReturnRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubmitReturnRequest'
      security:
      - visitorSession: []
        csrfToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRequestDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
  /api/v1/session/:
    get:
      operationId: bootstrapVisitorSession
      description: Creates or resumes the server-owned visitor sandbox, seeds the
        fictional dataset once, and sets the session and CSRF cookies. No visitor
        UUID is exposed.
      summary: Bootstrap the isolated demo session
      tags:
      - Demo session
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorSessionResponse'
              examples:
                ReadyDemoSession:
                  value:
                    expires_at: '2026-08-01T16:00:00Z'
                    available_roles:
                    - CUSTOMER
                    - OPERATIONS
                    supported_locales:
                    - en
                    - es
                    dataset_ready: true
                  summary: Ready demo session
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Stable API error envelope.
components:
  schemas:
    APIError:
      type: object
      description: Stable error envelope returned by every handled API exception.
      properties:
        code:
          type: string
          readOnly: true
        detail:
          type: string
          readOnly: true
        fields:
          readOnly: true
      required:
      - code
      - detail
      - fields
    AvailableRolesEnum:
      enum:
      - CUSTOMER
      - OPERATIONS
      type: string
      description: |-
        * `CUSTOMER` - CUSTOMER
        * `OPERATIONS` - OPERATIONS
    CatalogReturnCreateRequest:
      type: object
      description: Reject unknown and server-controlled fields instead of ignoring
        them.
      properties:
        order_id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogReturnItemSelectionRequest'
      required:
      - items
      - order_id
    CatalogReturnItemSelectionRequest:
      type: object
      description: Reject unknown and server-controlled fields instead of ignoring
        them.
      properties:
        order_item_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        reason:
          $ref: '#/components/schemas/ReasonEnum'
        details:
          type: string
          default: ''
          maxLength: 2000
      required:
      - order_item_id
      - quantity
      - reason
    DemoOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        order_reference:
          type: string
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        customer_email:
          type: string
          format: email
          readOnly: true
        currency:
          type: string
          readOnly: true
        placed_at:
          type: string
          format: date-time
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/DemoOrderItem'
          readOnly: true
      required:
      - currency
      - customer_email
      - customer_name
      - id
      - items
      - order_reference
      - placed_at
    DemoOrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sku:
          type: string
          readOnly: true
        product_name:
          type: string
          readOnly: true
        quantity:
          type: integer
          readOnly: true
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - id
      - line_total
      - product_name
      - quantity
      - sku
      - unit_price
    DemoResetResponse:
      type: object
      properties:
        reset_at:
          type: string
          format: date-time
          readOnly: true
        return_count:
          type: integer
          readOnly: true
        message_code:
          type: string
