      enum:
      - en
      - es
      type: string
      description: |-
        * `en` - en
        * `es` - es
    TargetStatusEnum:
      enum:
      - NEEDS_INFORMATION
      - APPROVED
      - REJECTED
      type: string
      description: |-
        * `NEEDS_INFORMATION` - NEEDS_INFORMATION
        * `APPROVED` - APPROVED
        * `REJECTED` - REJECTED
