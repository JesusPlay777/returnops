name: ${COMPOSE_PROJECT_NAME:-returnops}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-returnops}
      POSTGRES_USER: ${POSTGRES_USER:-returnops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-returnops_local}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-returnops}
      POSTGRES_USER: ${POSTGRES_USER:-returnops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-returnops_local}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-returnops-insecure-local-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
      RETURNOPS_VISITOR_SESSION_TTL_HOURS: ${RETURNOPS_VISITOR_SESSION_TTL_HOURS:-24}
    command:
      - python
      - manage.py
      - runserver
      - 0.0.0.0:8000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      target: development
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      BACKEND_INTERNAL_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
    command:
      - npm
      - run
      - dev
      - --
      - --hostname
      - 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
  frontend_node_modules:
